<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FIOracle</title>
<meta name="description" content="Twenty rebalance dates. Your weights, FIOracle, and the benchmarks." />
<link rel="canonical" href="https://zauberstern.github.io/fioracle/" />
<meta name="theme-color" content="#F3F0E8" />
<meta name="robots" content="index,follow" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" />
<link rel="icon" href="fi-oracle.png" type="image/png" />
<link rel="stylesheet" href="vendor/uPlot.min.css" />
<link rel="stylesheet" href="sandbox/sandbox.css" />
</head>
<body data-replay="sandbox/data/replay.json" data-trees="sandbox/data/trees/">
<a href="#question" class="skip-link">Skip to content</a>
<div class="top">
  <header class="mast">
    <a class="brand" href="./">
      <img src="fi-oracle.png" alt="" width="1024" height="1024">
      <span>FIOracle</span>
    </a>
    <button type="button" id="nav-toggle" class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">Index</button>
    <nav id="nav-links" class="nav-links" aria-label="Primary">
      <a href="compass/">Meridian</a>
      <a href="compass/desk/">Stillmoor</a>
    </nav>
  </header>
  <div class="legend" aria-label="Chart key">
    <span class="swatch yours"><i></i>Yours</span>
    <span class="swatch book"><i></i>FIOracle</span>
    <span class="swatch equal"><i></i>Equal weight</span>
    <span class="swatch sixty"><i></i>60/40</span>
    <div class="path-menu">
      <button type="button" id="other-toggle" aria-expanded="false" aria-haspopup="true" aria-controls="other">Other paths</button>
      <section id="other" class="path-drop" hidden>
        <p id="note"></p>
        <div id="toggles" class="toggles"></div>
        <p class="path-links"><a id="download" href="#">Download booster</a></p>
        <p class="path-links"><a href="https://github.com/zauberstern/fioracle">zauberstern/fioracle</a></p>
      </section>
    </div>
  </div>
  <div id="chart-wrap">
    <p id="hover" class="hover" hidden></p>
    <div id="chart"></div>
    <p class="axis-year">Year</p>
  </div>
  <div class="scrub">
    <button type="button" id="prev-q">Previous</button>
    <input id="when" type="range" min="0" value="0" aria-label="Date">
    <button type="button" id="next-q">Next</button>
  </div>
</div>
<div class="bottom">
  <aside id="wealth" aria-label="Wealth">
    <h2 class="wealth-word">Wealth</h2>
    <p class="wealth-line"><span id="wealth-fig"></span></p>
    <p id="wealth-on"></p>
    <dl id="wealth-stats" class="wealth-stats"></dl>
  </aside>
  <section id="question" aria-label="Question">
    <div class="qhead">
      <p id="qcount"></p>
      <button type="button" id="reveal-btn">Show FIOracle's choice</button>
      <button type="button" id="clear" disabled>Clear</button>
      <nav id="dates" class="qmarks" aria-label="Questions"></nav>
      <p id="qtip" class="qtip" hidden></p>
    </div>
    <div id="reading"></div>
  </section>
  <aside id="editor" aria-label="Weights">
    <p id="status" class="status" role="status" aria-live="polite">Loading FIOracle.</p>
    <h2>Weights</h2>
    <div id="rows"></div>
    <div class="editor-foot">
      <p id="sum" class="sum"></p>
      <p class="sum">10000 is the whole book.</p>
      <button type="button" id="apply" disabled>Apply</button>
    </div>
  </aside>
</div>
<script src="vendor/uPlot.iife.min.js"></script>
<script src="sandbox/style.js"></script>
<script src="sandbox/sandbox.js?v=75dee15"></script>
</body>
</html>
