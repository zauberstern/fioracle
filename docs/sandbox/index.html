<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FIOracle sandbox</title>
<meta name="theme-color" content="#101210" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" />
<link rel="icon" href="../fi-oracle.png" type="image/png" />
<link rel="stylesheet" href="sandbox.css" />
</head>
<body>
<a href="#board" class="skip-link">Skip to content</a>
<header class="top">
  <a class="brand" href="../index.html">
    <img src="../fi-oracle.png" alt="" width="1024" height="1024">
    <span>FIOracle</span>
  </a>
  <nav class="nav-links" aria-label="Primary">
    <a href="../index.html">Home</a>
    <a href="../compass/">Meridian</a>
    <a href="../compass/desk/">Stillmoor</a>
  </nav>
</header>
<main id="board">
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <div id="desk" class="desk" hidden>
    <div id="dates" class="dates" role="group" aria-label="Saved dates"></div>
    <section class="ring-wrap" aria-label="Regime">
      <svg id="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle id="ring-stroke" cx="60" cy="60" r="46" fill="none" stroke="#3E4642" stroke-width="3"></circle>
      </svg>
      <p id="ring-label"></p>
      <label class="pick">Sleeve
        <select id="asset"></select>
      </label>
      <p><a id="download" href="#">Download booster</a></p>
    </section>
    <section class="book" aria-label="Weights">
      <div id="probs"></div>
      <div class="book-head">
        <h2>Minimum variance</h2>
        <button type="button" id="hold">Hold</button>
      </div>
      <div id="bars"></div>
      <table id="weights">
        <thead><tr><th>Sleeve</th><th>Weight</th></tr></thead>
        <tbody></tbody>
      </table>
      <p id="weight-sum"></p>
    </section>
  </div>
</main>
<script src="sandbox.js"></script>
</body>
</html>
