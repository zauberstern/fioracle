# Fioracle Configuration
# All settings for regime-aware portfolio optimization

# =============================================================================
# DATA CONFIGURATION
# =============================================================================
data:
  # Full historical window (1945-present)
  start_date: 1945-01-01
  end_date: 2025-11-12  # Updated to current date
  
  # Train/Validation/Test splits for optimal ML workflow
  train_start: 1945-01-01
  train_end: 1977-05-06    # 40% of window
  
  val_start: 1977-05-07
  val_end: 1993-07-08      # 20% of window
  
  test_start: 1993-07-09
  test_end: 2025-11-12     # 40% of window
  
  cache_dir: data/cache
  
  sources:
    # LSEG Refinitiv modern data (2000+)
    lseg:
      enabled: true
      credential_file: config/lseg_credentials.yaml
    
    # FRED-MD macroeconomic indicators
    fred_md:
      enabled: true
      n_components: 5  # PCA components for dimensionality reduction
    
    # JST Macrohistory Database (1870-2017)
    jst:
      enabled: true
      start_year: 1945
      end_year: 2017

# =============================================================================
# ASSET CONFIGURATION
# =============================================================================
assets:
  # Basic mode: 9 core assets (expanded with commodities)
  basic:
    - SP500
    - BOND_10Y
    - CORP_AAA
    - CORP_BAA
    - BILLS_3M     # 3-month Treasury bills (cash)
    - GOLD         # Gold (commodity/inflation hedge)
    - SILVER       # Silver (commodity/inflation hedge)
    - OIL          # Brent crude oil (inflation hedge)
    - CHF          # Swiss franc (foreign currency)
    - CH_BOND      # Swiss long-term government bonds
  
  # Full mode: 12 assets including modern ETFs (2002+)
  full:
    - SP500
    - BOND_10Y
    - CORP_AAA
    - CORP_BAA
    - BILLS_3M     # 3-month Treasury bills (cash)
    - GOLD         # Gold (commodity/inflation hedge)
    - SILVER       # Silver (commodity/inflation hedge)
    - OIL          # Brent crude oil (inflation hedge)
    - CHF          # Swiss franc (foreign currency)
    - CH_BOND      # Swiss long-term government bonds
    - TIP          # TIPS ETF (inflation-protected, 2003+)
    - LQD          # Investment grade corporate ETF (2002+)
    - HYG          # High yield corporate ETF (2007+)

# =============================================================================
# REGIME IDENTIFICATION CONFIGURATION
# =============================================================================
regimes:
  # Jump Model parameters
  jump_model:
    lambda_candidates:  # Values to try during tuning
      - 0.1
      - 0.5
      - 1.0
      - 2.0
      - 5.0
      - 10.0
      - 20.0
      - 50.0
    default_lambda: 5.0  # Default if not tuning
  
  # HMM parameters
  hmm:
    n_states: 3  # Number of hidden states
    covariance_type: full  # 'full', 'diag', 'spherical'
    n_iter: 200  # Max iterations for EM algorithm
  
  # XGBoost classifier parameters
  xgboost:
    max_depth: 5
    n_estimators: 100
    learning_rate: 0.1
    random_state: 42

# =============================================================================
# FEATURE ENGINEERING CONFIGURATION
# =============================================================================
features:
  # Asset-specific features (Layer C)
  asset:
    halflives:  # Exponential weighting half-lives (in days)
      - 21   # ~1 month
      - 63   # ~3 months
      - 126  # ~6 months
    
    windows:  # Rolling window sizes
      - 21
      - 63
      - 126
  
  # Macro features (Layers A/B)
  macro:
    stock_bond_correlation_window: 252  # 1 year
    use_pca: true
    pca_components: 10

# =============================================================================
# PORTFOLIO OPTIMIZATION CONFIGURATION
# =============================================================================
portfolio:
  # Risk and trade aversion parameters
  gamma_risk: 10.0  # Risk aversion (higher = more conservative)
  gamma_trade: 1.0  # Trade aversion (higher = less turnover)
  
  # Transaction costs
  transaction_cost: 0.0005  # 5 basis points
  
  # Position limits
  max_weight: 0.40  # Maximum 40% in any single asset
  min_weight: 0.00  # Long-only (no shorting)
  max_leverage: 1.0  # No leverage (sum of weights ≤ 1.0)
  
  # Capital preservation
  capital_preservation_threshold: 2  # Min bullish assets before going to cash
  
  # Covariance estimation
  ewmc_decay: 0.94  # Exponential weighting for covariance
  
  # GPR adjustment
  use_gpr_scaling: true  # Scale correlations by geopolitical risk

# =============================================================================
# EVALUATION CONFIGURATION
# =============================================================================
evaluation:
  # Data splits (aligned with data configuration)
  # Training:   1945-2000 (55 years) - learn long-term regime patterns
  # Validation: 2001-2010 (10 years) - tune hyperparameters, select models
  # Test:       2011-2025 (14 years) - final out-of-sample evaluation
  
  use_walk_forward: true  # Enable walk-forward validation
  rebalance_frequency: monthly  # How often to rebalance portfolio
  
  # Cross-validation for hyperparameter tuning (on validation set)
  cv_folds: 5
  
  # Performance metrics to calculate
  metrics:
    - sharpe
    - max_dd
    - var_99
    - calmar
    - sortino
    - omega
  
  # Benchmarks
  benchmarks:
    - equal_weight  # Equal-weighted portfolio
    - buy_hold      # Buy and hold each asset
    - sp500         # S&P 500 only

# =============================================================================
# OUTPUT CONFIGURATION
# =============================================================================
output:
  # Directories
  figures_dir: output/figures
  models_dir: output/models
  results_dir: output/results
  
  # File names
  performance_file: performance_summary.csv
  weights_file: portfolio_weights.csv
  returns_file: portfolio_returns.csv
  lambdas_file: optimal_lambdas.json
  
  # Figure settings
  plot_types:
    - cumulative_returns
    - drawdown
    - weights
    - regime_timeline
    - feature_importance
    - performance_summary
  
  dpi: 300  # Resolution for saved figures
  format: png  # Figure format (png, pdf, svg)

# =============================================================================
# PERFORMANCE CONFIGURATION
# =============================================================================
performance:
  use_numba: true  # Enable JIT compilation (faster)
  use_cache: true  # Enable parquet caching
  cache_compression: snappy  # Compression algorithm (snappy, gzip, brotli)
  cache_size_mb: 1000  # Max cache size

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: output/fioracle.log
  console: true
