services:
  api:
    build:
      context: ..
      dockerfile: bubble_compass/Dockerfile
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      BUBBLE_COMPASS_CACHE: /app/data/cache
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./body:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_WS_URL: ws://localhost:8000/ws
