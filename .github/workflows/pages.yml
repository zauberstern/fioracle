# Enable Pages: Settings > Pages > Deploy from branch main / docs.
# No publish action required for /docs on main (avoids peaceiris/gh-pages).
name: pages-docs-check

on:
  pull_request:
    paths:
      - "docs/**"
      - "tests/test_github_pages.py"
      - "scripts/export_gate_status.py"
      - "src/core/convexity_gates.py"

jobs:
  pages-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest
      - name: Pages contract tests
        run: python -m pytest tests/test_github_pages.py -q -o addopts=
